<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quiz V1 → V2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;padding:15px}
  .c{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:600px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  h1,h2{color:#4a3f8f;text-align:center;margin-bottom:8px;font-size:22px}
  .sub{text-align:center;color:#888;font-size:13px;margin-bottom:20px}
  .info{background:#f4f3ff;border-radius:14px;padding:18px;margin-bottom:20px;text-align:center;color:#4a3f8f;font-size:15px;line-height:1.8}
  .info b{color:#764ba2}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;background:#764ba2;color:#fff;margin-top:12px;transition:.2s;font-family:inherit}
  .btn:active{transform:scale(.97);background:#5f3a85}
  .btn.sec{background:#e0ddf0;color:#4a3f8f}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;font-weight:600;color:#555}
  .badge{background:#764ba2;color:#fff;padding:6px 14px;border-radius:20px}
  .timer{background:#ffe9b8;color:#8a6d00;padding:6px 14px;border-radius:20px}
  .prog{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin-bottom:22px}
  .prog div{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0;transition:.3s}
  .q{font-size:21px;font-weight:700;color:#333;text-align:center;margin-bottom:22px;line-height:1.5}
  .q span{color:#764ba2;font-size:26px}
  .opts{display:grid;gap:11px}
  .opt{padding:16px 18px;border:2px solid #e0ddf0;border-radius:14px;background:#fff;font-size:17px;text-align:left;font-weight:500;cursor:pointer;transition:.15s;color:#333;font-family:inherit;-webkit-appearance:none}
  .opt:active:not(:disabled){border-color:#764ba2;background:#f9f7ff}
  .opt.ok{border-color:#22c55e;background:#dcfce7;color:#15803d;font-weight:700}
  .opt.no{border-color:#ef4444;background:#fee2e2;color:#b91c1c;font-weight:700}
  .opt.dim{opacity:.5}
  .fb{text-align:center;margin-top:14px;font-weight:600;font-size:15px;min-height:22px}
  .score{width:150px;height:150px;border-radius:50%;margin:0 auto 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 15px 40px rgba(118,75,162,.4)}
  .score .n{font-size:44px;font-weight:800}
  .score .l{font-size:12px;opacity:.9}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .stat{padding:15px;border-radius:14px;text-align:center}
  .stat .n{font-size:24px;font-weight:800}
  .stat .t{font-size:12px;color:#666;margin-top:4px}
  .ok-stat{background:#dcfce7}.ok-stat .n{color:#15803d}
  .no-stat{background:#fee2e2}.no-stat .n{color:#b91c1c}
  .rank{text-align:center;font-size:17px;font-weight:700;color:#764ba2;margin-bottom:18px;padding:12px;background:#f4f3ff;border-radius:12px}
  .rev{max-height:240px;overflow-y:auto;margin-bottom:14px}
  .rev-i{padding:11px 14px;border-radius:10px;margin-bottom:8px;font-size:13px;background:#fee2e2;border-left:4px solid #ef4444;color:#7f1d1d}
  .rev-i b{color:#b91c1c}
  .rev-i .a{color:#15803d;font-weight:700}
</style>
</head>
<body>
<div class="c" id="app">

  <div id="start">
    <h1>📚 Quiz Động Từ Bất Quy Tắc</h1>
    <p class="sub">V1 (Nguyên mẫu) → V2 (Quá khứ)</p>
    <div class="info">
      🎯 <b id="total">0</b> câu hỏi<br>
      ⏱️ Có tính thời gian<br>
      🏆 Chấm điểm và xếp loại<br>
      🔍 Xem lại câu sai
    </div>
    <button class="btn" onclick="start()">Bắt đầu làm bài 🚀</button>
  </div>

  <div id="quiz" style="display:none">
    <div class="bar">
      <span class="badge" id="cnt">Câu 1</span>
      <span class="timer" id="tm">⏱️ 00:00</span>
    </div>
    <div class="prog"><div id="pg"></div></div>
    <div class="q" id="qq"></div>
    <div class="opts" id="oo"></div>
    <div class="fb" id="ff"></div>
  </div>

  <div id="end" style="display:none"></div>

</div>

<script>
const V=[["awake","awoke"],["be","was/were"],["become","became"],["begin","began"],["bleed","bled"],["blow","blew"],["break","broke"],["bring","brought"],["build","built"],["burn","burnt/burned"],["buy","bought"],["catch","caught"],["choose","chose"],["come","came"],["cost","cost"],["cut","cut"],["deal","dealt"],["draw","drew"],["dream","dreamt/dreamed"],["drink","drank"],["drive","drove"],["eat","ate"],["fall","fell"],["feed","fed"],["feel","felt"],["fight","fought"],["find","found"],["fly","flew"],["forbid","forbade/forbad"],["forecast","forecast/forecasted"],["forget","forgot"],["forgive","forgave"],["freeze","froze"],["get","got"],["give","gave"],["go","went"],["grow","grew"],["hang","hung"],["hear","heard"],["hide","hid"],["hit","hit"],["hurt","hurt"],["keep","kept"],["knit","knit/knitted"],["know","knew"],["lay","laid"],["lead","led"],["learn","learnt/learned"],["leave","left"],["lend","lent"],["let","let"],["lie","lay"],["light","lit/lighted"],["lose","lost"],["make","made"],["mean","meant"],["meet","met"],["misunderstand","misunderstood"],["overcome","overcame"],["pay","paid"],["prove","proved"],["put","put"],["read","read"],["ride","rode"],["ring","rang"],["rise","rose"],["run","ran"],["saw","sawed"],["say","said"],["see","saw"],["sell","sold"],["send","sent"],["shine","shone"],["shoot","shot"],["show","showed"],["sing","sang"],["sit","sat"],["sleep","slept"],["smell","smelt"],["speak","spoke"],["spell","spelt/spelled"],["spend","spent"],["spoil","spoilt/spoiled"],["spread","spread"],["stand","stood"],["steal","stole"],["stick","stuck"],["swim","swam"],["take","took"],["teach","taught"],["tell","told"],["think","thought"],["throw","threw"],["understand","understood"],["wake","woke/waked"],["wear","wore"],["weave","wove/weaved"],["win","won"],["wind","wound"],["work","worked"],["write","wrote"]];
const S=a=>a.sort(()=>Math.random()-.5);
let Q=[],i=0,c=0,w=[],t=0,tm=null;
const $=id=>document.getElementById(id);
document.getElementById('total').textContent=V.length;

function start(){
  Q=S([...V]).map(([a,b])=>({a,b,o:S([b,...S(V.filter(x=>x[1]!=b)).slice(0,3).map(x=>x[1])])}));
  i=0;c=0;w=[];t=0;
  $('start').style.display='none';
  $('quiz').style.display='block';
  $('end').style.display='none';
  clearInterval(tm);
  tm=setInterval(()=>{t++;$('tm').textContent='⏱️ '+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
  render();
}

function render(){
  const q=Q[i];
  $('cnt').textContent=`Câu ${i+1}/${Q.length}`;
  $('pg').style.width=(i/Q.length*100)+'%';
  $('qq').innerHTML=`V2 của <span>"${q.a}"</span>?`;
  $('ff').textContent='';
  const o=$('oo');o.innerHTML='';
  q.o.forEach(x=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=x;
    b.onclick=()=>check(b,x);
    o.appendChild(b);
  });
}

function check(b,x){
  const q=Q[i],ok=x===q.b;
  document.querySelectorAll('.opt').forEach(z=>{
    z.disabled=true;
    if(z.textContent===q.b)z.classList.add('ok');
    else if(z===b)z.classList.add('no');
    else z.classList.add('dim');
  });
  if(ok){c++;$('ff').textContent='✅ Đúng!';$('ff').style.color='#22c55e'}
  else{w.push({a:q.a,b:q.b,x});$('ff').textContent='❌ Sai! Đáp án: '+q.b;$('ff').style.color='#ef4444'}
  setTimeout(()=>{i++;i<Q.length?render():end()},1200);
}

function end(){
  clearInterval(tm);
  const sc=(c/Q.length*10).toFixed(1);
  const pct=c/Q.length;
  const rank=pct>=.9?'🏆 Xuất sắc!':pct>=.8?'🌟 Giỏi!':pct>=.65?'👍 Khá!':pct>=.5?'🙂 Trung bình':'💪 Cố gắng thêm!';
  $('quiz').style.display='none';
  const e=$('end');e.style.display='block';
  e.innerHTML=`
    <h2>🎉 Kết quả</h2>
    <div class="score"><div class="n">${sc}</div><div class="l">ĐIỂM / 10</div></div>
    <div class="rank">${rank}</div>
    <div class="stats">
      <div class="stat ok-stat"><div class="n">${c}</div><div class="t">Câu đúng</div></div>
      <div class="stat no-stat"><div class="n">${w.length}</div><div class="t">Câu sai</div></div>
    </div>
    ${w.length?`<div class="rev">${w.map(x=>`<div class="rev-i"><b>${x.a}</b> → bạn chọn: ${x.x} | Đúng: <span class="a">${x.b}</span></div>`).join('')}</div>`:'<div class="rev"><div class="rev-i" style="background:#dcfce7;border-left-color:#22c55e;color:#15803d">🎉 Tuyệt vời! Không sai câu nào!</div></div>'}
    <button class="btn" onclick="start()">🔄 Làm lại</button>
  `;
}
</script>
</body>
</html>
